services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zoom-clone-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    container_name: zoom-clone-livekit
    command: --dev --key-file /etc/livekit.keys --bind 0.0.0.0
    ports:
      - "7890:7880"
      - "7891:7881"
      - "7892:7882/udp"
    volumes:
      - ./livekit.keys:/etc/livekit.keys
    restart: unless-stopped
